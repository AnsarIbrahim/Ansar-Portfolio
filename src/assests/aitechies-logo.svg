<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <title>AI Techies</title>
  <defs>
    <!-- Deep premium background (Linear / Vercel feel) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1A0B2E"/>
      <stop offset="100%" stop-color="#06000F"/>
    </linearGradient>
    <!-- Brand accent gradient for the monogram -->
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Subtle top-left highlight for depth -->
    <radialGradient id="shine" cx="22%" cy="18%" r="70%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Hairline inner edge -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- iOS-style squircle background -->
  <rect width="256" height="256" rx="60" fill="url(#bg)"/>
  <rect width="256" height="256" rx="60" fill="url(#shine)"/>
  <rect x="1" y="1" width="254" height="254" rx="59" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <!-- Bold geometric "A" monogram with negative-space crossbar -->
  <path
    fill="url(#mark)"
    d="M62 200 H102 L112 172 H144 L154 200 H194 L138 56 H118 Z M122 142 H134 L128 110 Z"/>

  <!-- Glowing accent dot (the 'i' / AI signal) -->
  <circle cx="200" cy="64" r="14" fill="#22D3EE"/>
  <circle cx="200" cy="64" r="22" fill="none" stroke="#22D3EE" stroke-opacity=".45" stroke-width="2.5"/>
</svg>
